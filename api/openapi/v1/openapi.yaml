openapi: 3.1.0
info:
  title: Project Progress Register API
  version: 0.1.0
  description: >-
    Authoritative contract for the implemented Project Progress Register HTTP API.
    Cookie-authenticated internal API. Login returns a session-bound CSRF token;
    authenticated write requests must send it in X-CSRF-Token.
servers:
  - url: '{basePath}'
    description: Current application origin and deployment prefix.
    variables:
      basePath:
        default: /
        description: The raw schema route resolves this default to the configured BASE_PATH, such as /backend.
tags:
  - name: Health
    description: Process and dependency health used by operators and the reverse proxy.
  - name: Identity
    description: One-time bootstrap, login, session recovery, and logout.
  - name: User administration
    description: Admin-only internal account lifecycle operations.
  - name: Projects
    description: Project lifecycle, scoped visibility, membership, and versioned site policy.
  - name: Tasks
    description: Project-scoped task register, immutable ownership, responsibility, dates, and safe Markdown.
  - name: Progress
    description: Chronological progress, immutable revisions, geotag evidence, private attachments, and authorized downloads.
paths:
  /api/v1/setup/bootstrap:
    post:
      tags: [Identity]
      operationId: bootstrapAdmin
      summary: Create the first Admin exactly once
      description: Available only while no users exist and BOOTSTRAP_TOKEN is configured. The token is never retained.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BootstrapRequest'}
            example: {bootstrap_token: replace-with-configured-secret, username: admin, email: admin@example.com, password: correct horse battery staple}
      responses:
        '201':
          description: Initial Admin created.
          content: {application/json: {schema: {$ref: '#/components/schemas/UserResponse'}}}
        '403': {$ref: '#/components/responses/BootstrapDenied'}
        '404': {$ref: '#/components/responses/BootstrapUnavailable'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/auth/login:
    post:
      tags: [Identity]
      operationId: login
      summary: Start a revocable opaque session
      description: Unknown, disabled, incorrect, and throttled credentials have the same client-visible response. Sets the host-only ppr_session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
            example: {identifier: admin, password: correct horse battery staple}
      responses:
        '200':
          description: Authenticated; a new session cookie is set.
          headers:
            Set-Cookie: {schema: {type: string}, description: HttpOnly host-only ppr_session cookie with SameSite=Lax; Secure in production.}
          content: {application/json: {schema: {$ref: '#/components/schemas/SessionResponse'}}}
        '401': {$ref: '#/components/responses/InvalidCredentials'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
  /api/v1/auth/session:
    get:
      tags: [Identity]
      operationId: getCurrentSession
      summary: Recover the authenticated user and CSRF token
      security: [{cookieSession: []}]
      responses:
        '200':
          description: Current non-expired session for an enabled user.
          content: {application/json: {schema: {$ref: '#/components/schemas/SessionResponse'}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /api/v1/auth/logout:
    post:
      tags: [Identity]
      operationId: logout
      summary: Revoke the current session
      description: Requires X-CSRF-Token when a valid session is present. Repeated logout without a session succeeds.
      security: [{cookieSession: []}]
      parameters:
        - in: header
          name: X-CSRF-Token
          required: false
          schema: {type: string}
          description: Required for an authenticated session and obtained from login or session recovery.
      responses:
        '200':
          description: Session is absent or has been revoked and the cookie is cleared.
          content: {application/json: {schema: {$ref: '#/components/schemas/LogoutResponse'}}}
        '403': {$ref: '#/components/responses/CSRFInvalid'}
  /api/v1/auth/password:
    post:
      tags: [Identity]
      operationId: changeOwnPassword
      summary: Replace the authenticated user's password
      description: Revokes every session including the current session and clears must_change_password. The caller must sign in again.
      security: [{cookieSession: []}]
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
      responses:
        '200':
          description: Password changed, all sessions revoked, and the cookie cleared.
          content: {application/json: {schema: {$ref: '#/components/schemas/PasswordChangedResponse'}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CSRFInvalid'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/admin/users:
    get:
      tags: [User administration]
      operationId: listUsers
      summary: List all internal accounts
      description: Requires an enabled Admin whose temporary password has already been replaced. Results are ordered by username.
      security: [{cookieSession: []}]
      responses:
        '200':
          description: Complete small internal account inventory.
          content: {application/json: {schema: {$ref: '#/components/schemas/UsersResponse'}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [User administration]
      operationId: createUser
      summary: Create an Admin or Member
      description: Generates a temporary password returned only in this no-store response. The user must replace it after login.
      security: [{cookieSession: []}]
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateUserRequest'}
      responses:
        '201':
          description: Account created; copy the temporary password now because it cannot be retrieved.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content: {application/json: {schema: {$ref: '#/components/schemas/CredentialResponse'}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/admin/users/{user_id}:
    patch:
      tags: [User administration]
      operationId: updateUser
      summary: Change an account role or enabled state
      description: Uses optimistic versioning, revokes all target sessions, and refuses to remove the final enabled Admin.
      security: [{cookieSession: []}]
      parameters:
        - {$ref: '#/components/parameters/UserID'}
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateUserRequest'}
      responses:
        '200':
          description: Account updated and target sessions revoked.
          content: {application/json: {schema: {$ref: '#/components/schemas/UserResponse'}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/admin/users/{user_id}/password-reset:
    post:
      tags: [User administration]
      operationId: resetUserPassword
      summary: Generate a temporary password for an account
      description: Replaces the password, sets must_change_password, revokes every target session, and returns the temporary password once.
      security: [{cookieSession: []}]
      parameters:
        - {$ref: '#/components/parameters/UserID'}
        - {$ref: '#/components/parameters/CSRFToken'}
      responses:
        '200':
          description: Password reset; copy the temporary password now because it cannot be retrieved.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content: {application/json: {schema: {$ref: '#/components/schemas/CredentialResponse'}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/admin/audit/identity:
    get:
      tags: [User administration]
      operationId: listIdentityAudit
      summary: List recent authentication and account audit events
      description: Returns the newest 200 identity, authentication, and account-authorization events. Requires an enabled Admin with no forced password change.
      security: [{cookieSession: []}]
      responses:
        '200':
          description: Newest identity audit events in reverse chronological order.
          content: {application/json: {schema: {$ref: '#/components/schemas/IdentityAuditResponse'}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects visible to the current user
      description: Admins receive every project. Members receive only projects with a current membership. Inactive projects remain readable for history.
      security: [{cookieSession: []}]
      responses:
        '200':
          description: Name-ordered authorized project list with current geofence policy when configured.
          content: {application/json: {schema: {$ref: '#/components/schemas/ProjectsResponse'}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project
      description: Admin-only command. Creates an active project without a geofence or members and appends project.created atomically.
      security: [{cookieSession: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateProjectRequest'}}}
      responses:
        '201':
          description: Project created.
          content: {application/json: {schema: {$ref: '#/components/schemas/ProjectResponse'}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/projects/{project_id}:
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get an authorized project
      description: Members without current membership receive the same 404 as an unknown identifier.
      security: [{cookieSession: []}]
      parameters: [{$ref: '#/components/parameters/ProjectID'}]
      responses:
        '200':
          description: Authorized project and current geofence policy.
          content: {application/json: {schema: {$ref: '#/components/schemas/ProjectResponse'}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Projects]
      operationId: updateProject
      summary: Replace mutable project fields
      description: Admin-only optimistic update of name, Markdown description, and active state. Projects are deactivated rather than deleted.
      security: [{cookieSession: []}]
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateProjectRequest'}}}
      responses:
        '200':
          description: Project updated.
          content: {application/json: {schema: {$ref: '#/components/schemas/ProjectResponse'}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/projects/{project_id}/members:
    get:
      tags: [Projects]
      operationId: listProjectMembers
      summary: List current project Members
      description: Admin-only query. Disabled accounts remain visible so access state is explicit.
      security: [{cookieSession: []}]
      parameters: [{$ref: '#/components/parameters/ProjectID'}]
      responses:
        '200':
          description: Username-ordered current membership list.
          content: {application/json: {schema: {$ref: '#/components/schemas/ProjectMembersResponse'}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/projects/{project_id}/members/{user_id}:
    put:
      tags: [Projects]
      operationId: addProjectMember
      summary: Add a current project Member
      description: Admin-only command. The target must currently be an enabled Member account. Historical membership rows are retained.
      security: [{cookieSession: []}]
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/UserID'}
        - {$ref: '#/components/parameters/CSRFToken'}
      responses:
        '201':
          description: Current membership created.
          content: {application/json: {schema: {$ref: '#/components/schemas/ProjectMemberResponse'}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      tags: [Projects]
      operationId: removeProjectMember
      summary: End a current project membership
      description: Admin-only command. Closes the temporal membership and immediately removes future Member access without erasing history.
      security: [{cookieSession: []}]
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/UserID'}
        - {$ref: '#/components/parameters/CSRFToken'}
      responses:
        '204': {description: Membership ended; no response body.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/projects/{project_id}/geofence:
    put:
      tags: [Projects]
      operationId: replaceProjectGeofence
      summary: Create or replace the current site geofence
      description: Admin-only optimistic command. Closes the previous immutable policy version and inserts the next version atomically.
      security: [{cookieSession: []}]
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ReplaceGeofenceRequest'}}}
      responses:
        '200':
          description: New current geofence policy.
          content: {application/json: {schema: {$ref: '#/components/schemas/GeofenceResponse'}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/projects/{project_id}/tasks:
    get:
      tags: [Tasks]
      operationId: listProjectTasks
      summary: List tasks in an authorized project
      description: Admins may read every project. Members require current membership. Inactive projects remain readable.
      security: [{cookieSession: []}]
      parameters: [{$ref: '#/components/parameters/ProjectID'}]
      responses:
        '200':
          description: Name-ordered task list with Markdown source and sanitized HTML projections.
          content: {application/json: {schema: {$ref: '#/components/schemas/TasksResponse'}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Tasks]
      operationId: createTask
      summary: Create a task in an active project
      description: Admins or current project Members may create. The authenticated user becomes immutable creator. Responsibility grants no access or edit ownership.
      security: [{cookieSession: []}]
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateTaskRequest'}}}
      responses:
        '201':
          description: Task created with version one.
          content: {application/json: {schema: {$ref: '#/components/schemas/TaskResponse'}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/projects/{project_id}/tasks/{task_id}:
    get:
      tags: [Tasks]
      operationId: getProjectTask
      summary: Get a task through authorized project scope
      description: Unknown, mismatched, and inaccessible identifiers all return 404.
      security: [{cookieSession: []}]
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/TaskID'}
      responses:
        '200':
          description: Task with Markdown source and sanitized HTML projections.
          content: {application/json: {schema: {$ref: '#/components/schemas/TaskResponse'}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Tasks]
      operationId: updateProjectTask
      summary: Replace mutable task fields
      description: Admins may edit any task. A Member must be both current project Member and immutable creator. Requires an active project and expected version.
      security: [{cookieSession: []}]
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/TaskID'}
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateTaskRequest'}}}
      responses:
        '200':
          description: Task updated and version incremented.
          content: {application/json: {schema: {$ref: '#/components/schemas/TaskResponse'}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/projects/{project_id}/tasks/{task_id}/progress-updates:
    get:
      tags: [Progress]
      operationId: listTaskProgressUpdates
      summary: List current progress entries chronologically
      description: Current project access is required. Returns current content, evidence, and attachment metadata; use detail for revision history.
      security: [{cookieSession: []}]
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/TaskID'}
      responses:
        '200':
          description: Oldest-first task diary entries.
          content: {application/json: {schema: {$ref: '#/components/schemas/ProgressUpdatesResponse'}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Progress]
      operationId: createTaskProgressUpdate
      summary: Create progress and optionally attach geotagged files
      description: >-
        Requires an active authorized project and an Idempotency-Key. The metadata JSON and files are ordered: one attachment descriptor per repeated files part.
        Every file requires reported coordinates. Geofence failure never rejects bytes. Only a camera-source image whose location passes server evaluation becomes verified;
        uploaded images, documents, and videos remain non-verified while retaining the upload geotag.
      security: [{cookieSession: []}]
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/TaskID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [metadata]
              properties:
                metadata: {$ref: '#/components/schemas/CreateProgressMetadata'}
                files:
                  type: array
                  maxItems: 25
                  description: Runtime-configured limit; default 10 and never above 25.
                  items: {type: string, format: binary}
            encoding:
              metadata: {contentType: application/json}
      responses:
        '201':
          description: Created update, or the identical result of an idempotent retry.
          content: {application/json: {schema: {$ref: '#/components/schemas/ProgressUpdateResponse'}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/RequestTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '503': {$ref: '#/components/responses/AttachmentPending'}
  /api/v1/projects/{project_id}/tasks/{task_id}/progress-updates/{update_id}:
    get:
      tags: [Progress]
      operationId: getTaskProgressUpdate
      summary: Get progress, evidence, attachments, and revision history
      security: [{cookieSession: []}]
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/TaskID'}
        - {$ref: '#/components/parameters/UpdateID'}
      responses:
        '200': {description: Complete progress detail., content: {application/json: {schema: {$ref: '#/components/schemas/ProgressUpdateResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Progress]
      operationId: updateTaskProgress
      summary: Replace current written progress and append a revision
      description: Members may edit only their own update; Admins may edit any. Evidence and attachments are immutable. Requires an active project and expected version.
      security: [{cookieSession: []}]
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/TaskID'}
        - {$ref: '#/components/parameters/UpdateID'}
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateProgressRequest'}}}
      responses:
        '200': {description: Updated current entry with appended immutable revision., content: {application/json: {schema: {$ref: '#/components/schemas/ProgressUpdateResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/projects/{project_id}/tasks/{task_id}/progress-updates/{update_id}/attachments/{attachment_id}/content:
    get:
      tags: [Progress]
      operationId: downloadProgressAttachment
      summary: Download one available attachment through current project authorization
      description: Streams immutable bytes with attachment disposition, the server-detected MIME, private no-store caching, and nosniff. Storage paths are never exposed.
      security: [{cookieSession: []}]
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/TaskID'}
        - {$ref: '#/components/parameters/UpdateID'}
        - {$ref: '#/components/parameters/AttachmentID'}
      responses:
        '200':
          description: Authorized attachment bytes.
          headers:
            Content-Disposition: {schema: {type: string}, description: Safe attachment filename disposition.}
            X-Content-Type-Options: {schema: {type: string, const: nosniff}}
          content: {application/octet-stream: {schema: {type: string, format: binary}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/AttachmentUnavailable'}
        '503': {$ref: '#/components/responses/AttachmentPending'}
  /api/v1/health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Check whether the process can serve HTTP
      description: Does not query PostgreSQL or other downstream dependencies.
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
              example:
                status: ok
  /api/v1/health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check whether stateful application traffic can be served
      description: >-
        Uses a bounded check for PostgreSQL connectivity and confirms that the
        checksummed migration ledger matches all migrations embedded in this build.
      responses:
        '200':
          description: PostgreSQL is reachable and the schema is current.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              example:
                status: ready
        '503':
          description: PostgreSQL is unavailable or the schema is not current. Internal details are not exposed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              example:
                status: not_ready
components:
  parameters:
    CSRFToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema: {type: string}
      description: Session-bound token returned by login or session recovery.
    UserID:
      in: path
      name: user_id
      required: true
      schema: {type: string, format: uuid}
    ProjectID:
      in: path
      name: project_id
      required: true
      schema: {type: string, format: uuid}
    TaskID:
      in: path
      name: task_id
      required: true
      schema: {type: string, format: uuid}
    UpdateID:
      in: path
      name: update_id
      required: true
      schema: {type: string, format: uuid}
    AttachmentID:
      in: path
      name: attachment_id
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
      description: Caller-generated retry key. Reuse is accepted only for the byte-identical metadata and file-hash request.
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: ppr_session
      description: Opaque session token; only its SHA-256 digest is stored.
  responses:
    InvalidCredentials:
      description: Credentials are invalid; account existence and throttle state are intentionally undisclosed.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}, example: {error: {code: invalid_credentials, message: The credentials are invalid.}}}}
    Unauthenticated:
      description: A current authenticated session is required.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    CSRFInvalid:
      description: The session-bound CSRF token is missing or invalid.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    BootstrapDenied:
      description: The bootstrap secret was rejected.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    BootstrapUnavailable:
      description: Initial setup is disabled or an account already exists.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    ValidationFailed:
      description: An input field failed validation.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    InvalidRequest:
      description: Multipart framing or metadata JSON is invalid.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    RequestTooLarge:
      description: The multipart request exceeds the configured bounded upload limit.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    UnsupportedMediaType:
      description: Content-Type does not match the operation contract (normally application/json or multipart/form-data).
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Forbidden:
      description: The authenticated account lacks the required role or must replace its temporary password.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Conflict:
      description: A unique current resource already exists, an expected version is stale, or a protected invariant would be violated.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    NotFound:
      description: The requested resource does not exist or is outside the caller's authorized scope.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    AttachmentPending:
      description: Metadata committed but staged bytes have not yet completed recoverable finalization. Retry with the same idempotency key or wait for reconciliation.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    AttachmentUnavailable:
      description: Metadata remains, but reconciliation determined that the immutable bytes are unavailable.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  schemas:
    BootstrapRequest:
      type: object
      additionalProperties: false
      required: [bootstrap_token, username, email, password]
      properties:
        bootstrap_token: {type: string, minLength: 24, maxLength: 256, writeOnly: true}
        username: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{2,31}$'}
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 12, maxLength: 128, writeOnly: true, description: At least 12 Unicode characters and at most 128 UTF-8 bytes.}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier: {type: string, maxLength: 254}
        password: {type: string, maxLength: 128, writeOnly: true}
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, email, role]
      properties:
        username: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{2,31}$'}
        email: {type: string, format: email, maxLength: 254}
        role: {type: string, enum: [admin, member]}
    UpdateUserRequest:
      type: object
      additionalProperties: false
      required: [role, enabled, expected_version]
      properties:
        role: {type: string, enum: [admin, member]}
        enabled: {type: boolean}
        expected_version: {type: integer, format: int64, minimum: 1}
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: {type: string, minLength: 12, maxLength: 128, writeOnly: true, description: At least 12 Unicode characters and at most 128 UTF-8 bytes.}
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [name, description_markdown]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        description_markdown: {type: string, maxLength: 20000, description: Maximum is enforced in UTF-8 bytes by the backend.}
    UpdateProjectRequest:
      type: object
      additionalProperties: false
      required: [name, description_markdown, active, expected_version]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        description_markdown: {type: string, maxLength: 20000}
        active: {type: boolean}
        expected_version: {type: integer, format: int64, minimum: 1}
    ReplaceGeofenceRequest:
      type: object
      additionalProperties: false
      required: [latitude, longitude, radius_metres, max_accuracy_metres, expected_version]
      properties:
        latitude: {type: number, format: double, minimum: -90, maximum: 90}
        longitude: {type: number, format: double, minimum: -180, maximum: 180}
        radius_metres: {type: number, format: double, minimum: 1, maximum: 100000}
        max_accuracy_metres: {type: number, format: double, minimum: 0.1, maximum: 10000}
        expected_version: {type: integer, format: int64, minimum: 0, description: Use zero when no current geofence exists.}
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [name, goals_markdown, description_markdown]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        goals_markdown: {type: string, maxLength: 20000, description: Maximum is enforced in UTF-8 bytes.}
        description_markdown: {type: string, maxLength: 50000, description: Maximum is enforced in UTF-8 bytes.}
        responsible_user_id:
          oneOf: [{type: string, format: uuid}, {type: 'null'}]
        target_date:
          oneOf: [{type: string, format: date}, {type: 'null'}]
    UpdateTaskRequest:
      type: object
      additionalProperties: false
      required: [name, goals_markdown, description_markdown, responsible_user_id, target_date, expected_version]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        goals_markdown: {type: string, maxLength: 20000}
        description_markdown: {type: string, maxLength: 50000}
        responsible_user_id:
          oneOf: [{type: string, format: uuid}, {type: 'null'}]
        target_date:
          oneOf: [{type: string, format: date}, {type: 'null'}]
        expected_version: {type: integer, format: int64, minimum: 1}
    User:
      type: object
      additionalProperties: false
      required: [id, username, email, role, enabled, must_change_password, created_at, updated_at, version]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        email: {type: string, format: email}
        role: {type: string, enum: [admin, member]}
        enabled: {type: boolean}
        must_change_password: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 1}
    UserResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties: {user: {$ref: '#/components/schemas/User'}}
    SessionResponse:
      type: object
      additionalProperties: false
      required: [user, csrf_token, expires_at]
      properties:
        user: {$ref: '#/components/schemas/User'}
        csrf_token: {type: string, description: Session-bound token required on authenticated writes.}
        expires_at: {type: string, format: date-time}
    UsersResponse:
      type: object
      additionalProperties: false
      required: [users]
      properties:
        users: {type: array, items: {$ref: '#/components/schemas/User'}}
    CredentialResponse:
      type: object
      additionalProperties: false
      required: [user, temporary_password]
      properties:
        user: {$ref: '#/components/schemas/User'}
        temporary_password: {type: string, readOnly: true, description: Returned once; never stored or available from later reads.}
    PasswordChangedResponse:
      type: object
      additionalProperties: false
      required: [password_changed, logged_out]
      properties:
        password_changed: {type: boolean, const: true}
        logged_out: {type: boolean, const: true}
    Project:
      type: object
      additionalProperties: false
      required: [id, name, description_markdown, description_html, active, created_by, created_at, updated_at, version, geofence]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description_markdown: {type: string}
        description_html: {type: string, readOnly: true, description: Backend-rendered allowlist-sanitized HTML derived from description_markdown.}
        active: {type: boolean}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 1}
        geofence:
          oneOf:
            - {$ref: '#/components/schemas/Geofence'}
            - {type: 'null'}
    Geofence:
      type: object
      additionalProperties: false
      required: [id, version, latitude, longitude, radius_metres, max_accuracy_metres, valid_from]
      properties:
        id: {type: string, format: uuid}
        version: {type: integer, format: int64, minimum: 1}
        latitude: {type: number, format: double}
        longitude: {type: number, format: double}
        radius_metres: {type: number, format: double}
        max_accuracy_metres: {type: number, format: double}
        valid_from: {type: string, format: date-time}
    ProjectMember:
      type: object
      additionalProperties: false
      required: [user_id, username, email, enabled, added_at]
      properties:
        user_id: {type: string, format: uuid}
        username: {type: string}
        email: {type: string, format: email}
        enabled: {type: boolean}
        added_at: {type: string, format: date-time}
    ProjectResponse:
      type: object
      additionalProperties: false
      required: [project]
      properties: {project: {$ref: '#/components/schemas/Project'}}
    ProjectsResponse:
      type: object
      additionalProperties: false
      required: [projects]
      properties: {projects: {type: array, items: {$ref: '#/components/schemas/Project'}}}
    ProjectMemberResponse:
      type: object
      additionalProperties: false
      required: [member]
      properties: {member: {$ref: '#/components/schemas/ProjectMember'}}
    ProjectMembersResponse:
      type: object
      additionalProperties: false
      required: [members]
      properties: {members: {type: array, items: {$ref: '#/components/schemas/ProjectMember'}}}
    GeofenceResponse:
      type: object
      additionalProperties: false
      required: [geofence]
      properties: {geofence: {$ref: '#/components/schemas/Geofence'}}
    TaskActor:
      type: object
      additionalProperties: false
      required: [user_id, username]
      properties:
        user_id: {type: string, format: uuid}
        username: {type: string}
    ResponsibleMember:
      type: object
      additionalProperties: false
      required: [user_id, username, enabled]
      properties:
        user_id: {type: string, format: uuid}
        username: {type: string}
        enabled: {type: boolean}
    Task:
      type: object
      additionalProperties: false
      required: [id, project_id, name, goals_markdown, goals_html, description_markdown, description_html, created_by, responsible_member, target_date, created_at, updated_at, version]
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        name: {type: string}
        goals_markdown: {type: string}
        goals_html: {type: string, readOnly: true, description: Backend-rendered allowlist-sanitized HTML.}
        description_markdown: {type: string}
        description_html: {type: string, readOnly: true, description: Backend-rendered allowlist-sanitized HTML.}
        created_by: {$ref: '#/components/schemas/TaskActor'}
        responsible_member:
          oneOf:
            - {$ref: '#/components/schemas/ResponsibleMember'}
            - {type: 'null'}
        target_date:
          oneOf: [{type: string, format: date}, {type: 'null'}]
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 1}
    TaskResponse:
      type: object
      additionalProperties: false
      required: [task]
      properties: {task: {$ref: '#/components/schemas/Task'}}
    TasksResponse:
      type: object
      additionalProperties: false
      required: [tasks]
      properties: {tasks: {type: array, items: {$ref: '#/components/schemas/Task'}}}
    ReportedLocation:
      type: object
      additionalProperties: false
      required: [latitude, longitude, accuracy_metres]
      properties:
        latitude: {type: number, format: double, minimum: -90, maximum: 90, description: Browser-reported and not hardware-attested.}
        longitude: {type: number, format: double, minimum: -180, maximum: 180, description: Browser-reported and not hardware-attested.}
        accuracy_metres: {type: number, format: double, minimum: 0.1, maximum: 100000, description: Browser-reported radius.}
        browser_observed_at:
          oneOf: [{type: string, format: date-time}, {type: 'null'}]
    AttachmentDescriptor:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source: {type: string, enum: [camera, upload], description: Browser-reported flow. Camera is allowed only for images and is not hardware attestation.}
        browser_last_modified_at:
          oneOf: [{type: string, format: date-time}, {type: 'null'}]
    CreateProgressMetadata:
      type: object
      additionalProperties: false
      required: [content_markdown, attachments]
      properties:
        content_markdown: {type: string, minLength: 1, maxLength: 50000, description: Non-whitespace Markdown; maximum is UTF-8 bytes.}
        location:
          oneOf: [{$ref: '#/components/schemas/ReportedLocation'}, {type: 'null'}]
          description: Required and non-null when files are present.
        location_unavailable_reason:
          oneOf: [{type: string, enum: [permission_denied, timeout, unavailable, not_supported]}, {type: 'null'}]
          description: Mutually exclusive with location; text-only submissions may use it.
        attachments:
          type: array
          maxItems: 25
          items: {$ref: '#/components/schemas/AttachmentDescriptor'}
          description: Ordered one-to-one with repeated files parts; runtime-configured limit defaults to 10 and never exceeds 25.
    UpdateProgressRequest:
      type: object
      additionalProperties: false
      required: [content_markdown, expected_version]
      properties:
        content_markdown: {type: string, minLength: 1, maxLength: 50000}
        expected_version: {type: integer, format: int64, minimum: 1}
    ProgressActor:
      type: object
      additionalProperties: false
      required: [user_id, username]
      properties:
        user_id: {type: string, format: uuid}
        username: {type: string}
    EvidenceGeofence:
      type: object
      additionalProperties: false
      required: [id, version, latitude, longitude, radius_metres, max_accuracy_metres]
      properties:
        id: {type: string, format: uuid}
        version: {type: integer, format: int64, minimum: 1}
        latitude: {type: number, format: double}
        longitude: {type: number, format: double}
        radius_metres: {type: number, format: double}
        max_accuracy_metres: {type: number, format: double}
    ProgressEvidence:
      type: object
      additionalProperties: false
      required: [location_status, location_reason, reported_location, location_unavailable_reason, geofence, computed_distance_metres]
      properties:
        location_status: {type: string, enum: [verified, unverified_outside, unverified_accuracy, unverified_no_geofence, unverified_unavailable, not_supplied]}
        location_reason: {type: string}
        reported_location:
          oneOf: [{$ref: '#/components/schemas/ReportedLocation'}, {type: 'null'}]
        location_unavailable_reason:
          oneOf: [{type: string, enum: [permission_denied, timeout, unavailable, not_supported]}, {type: 'null'}]
        geofence:
          oneOf: [{$ref: '#/components/schemas/EvidenceGeofence'}, {type: 'null'}]
          description: Immutable server-selected policy snapshot at submission time.
        computed_distance_metres:
          oneOf: [{type: number, format: double}, {type: 'null'}]
    ProgressAttachment:
      type: object
      additionalProperties: false
      required: [id, original_name, reported_mime, detected_mime, media_kind, source, source_trust, verification_status, verification_reason, size_bytes, sha256, browser_last_modified_at, embedded_metadata, embedded_metadata_trust, storage_state, failure_reason, content_path, created_at, available_at]
      properties:
        id: {type: string, format: uuid}
        original_name: {type: string, maxLength: 255}
        reported_mime: {type: string, description: Untrusted browser declaration.}
        detected_mime: {type: string, description: Server-detected allowlisted type used for download.}
        media_kind: {type: string, enum: [image, document, video]}
        source: {type: string, enum: [camera, upload]}
        source_trust: {type: string, const: browser_reported}
        verification_status: {type: string, enum: [verified, non_verified]}
        verification_reason: {type: string}
        size_bytes: {type: integer, format: int64, minimum: 1, maximum: 1073741824}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        browser_last_modified_at:
          oneOf: [{type: string, format: date-time}, {type: 'null'}]
        embedded_metadata: {type: object, additionalProperties: true, description: Reserved untrusted embedded metadata map; empty when not extracted.}
        embedded_metadata_trust: {type: string, const: untrusted}
        storage_state: {type: string, enum: [pending, available, failed]}
        failure_reason: {type: string, description: Empty unless recovery determines staged bytes are unavailable; never contains a filesystem path.}
        content_path: {type: string, description: Authorized same-origin download path including the configured BASE_PATH; never a filesystem path.}
        created_at: {type: string, format: date-time}
        available_at:
          oneOf: [{type: string, format: date-time}, {type: 'null'}]
    ProgressRevision:
      type: object
      additionalProperties: false
      required: [id, from_version, to_version, previous_content_markdown, previous_content_html, new_content_markdown, new_content_html, edited_by, edited_at]
      properties:
        id: {type: string, format: uuid}
        from_version: {type: integer, format: int64, minimum: 1}
        to_version: {type: integer, format: int64, minimum: 2}
        previous_content_markdown: {type: string}
        previous_content_html: {type: string, readOnly: true}
        new_content_markdown: {type: string}
        new_content_html: {type: string, readOnly: true}
        edited_by: {$ref: '#/components/schemas/ProgressActor'}
        edited_at: {type: string, format: date-time}
    ProgressUpdate:
      type: object
      additionalProperties: false
      required: [id, project_id, task_id, content_markdown, content_html, created_by, evidence, attachments, revisions, created_at, updated_at, version]
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        task_id: {type: string, format: uuid}
        content_markdown: {type: string}
        content_html: {type: string, readOnly: true, description: Allowlist-sanitized HTML derived from content_markdown.}
        created_by: {$ref: '#/components/schemas/ProgressActor'}
        evidence: {$ref: '#/components/schemas/ProgressEvidence'}
        attachments:
          type: array
          description: Every attachment inherits this update's immutable evidence.reported_location upload geotag; verification_status remains per attachment.
          items: {$ref: '#/components/schemas/ProgressAttachment'}
        revisions: {type: array, items: {$ref: '#/components/schemas/ProgressRevision'}, description: Empty in list responses and complete in detail/mutation responses.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 1}
    ProgressUpdateResponse:
      type: object
      additionalProperties: false
      required: [progress_update]
      properties: {progress_update: {$ref: '#/components/schemas/ProgressUpdate'}}
    ProgressUpdatesResponse:
      type: object
      additionalProperties: false
      required: [progress_updates]
      properties: {progress_updates: {type: array, items: {$ref: '#/components/schemas/ProgressUpdate'}}}
    IdentityAuditRecord:
      type: object
      additionalProperties: false
      required: [id, action, target_type, outcome, occurred_at, request_id, client_ip, user_agent, details]
      properties:
        id: {type: string, format: uuid}
        actor_user_id: {type: string, format: uuid}
        actor_username: {type: string}
        action: {type: string}
        target_type: {type: string}
        target_id: {type: string, format: uuid}
        outcome: {type: string, enum: [succeeded, failed, denied]}
        occurred_at: {type: string, format: date-time}
        request_id: {type: string}
        client_ip: {type: string}
        user_agent: {type: string}
        details: {type: object, additionalProperties: true}
    IdentityAuditResponse:
      type: object
      additionalProperties: false
      required: [audit_events]
      properties:
        audit_events: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/IdentityAuditRecord'}}
    LogoutResponse:
      type: object
      additionalProperties: false
      required: [logged_out]
      properties: {logged_out: {type: boolean, const: true}}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
    LivenessResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
