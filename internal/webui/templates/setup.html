{{define "setup"}}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Initial setup — {{.AppName}}</title><link rel="stylesheet" href="/assets/app.css"></head>
<body><main class="shell"><header><p class="eyebrow">One-time setup</p><h1>Create the initial Admin</h1></header>
<section class="panel"><form method="post" action="/setup"><label>Bootstrap token<input type="password" name="bootstrap_token" autocomplete="off" required></label><label>Username<input name="username" autocomplete="username" minlength="3" maxlength="32" required></label><label>Email<input type="email" name="email" autocomplete="email" required></label><label>Password<input type="password" name="password" autocomplete="new-password" minlength="12" required></label><button type="submit">Create Admin</button></form></section></main></body></html>
{{end}}
